services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_wal_size=256MB
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - angara-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [angara-internal]
    shm_size: 96mb
    pids_limit: 100

  app:
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    networks: [angara-internal, angara-edge]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in .env}
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [angara-edge]

  # Small relay-only trial. It is isolated from Angara networks and exposes no
  # VPN port or TURN administration interface.
  turn:
    image: coturn/coturn:4.17.2-r0
    restart: unless-stopped
    env_file: .env
    ports:
      - "${TURN_LISTEN_IP:?set TURN_LISTEN_IP in .env}:3478:3478/tcp"
      - "${TURN_LISTEN_IP:?set TURN_LISTEN_IP in .env}:3478:3478/udp"
      - "${TURN_LISTEN_IP:?set TURN_LISTEN_IP in .env}:49160-49175:49160-49175/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --listening-ip=172.30.0.2
      - --relay-ip=172.30.0.2
      - --external-ip=${TURN_LISTEN_IP:?set TURN_LISTEN_IP in .env}/172.30.0.2
      - --min-port=49160
      - --max-port=49175
      - --realm=${APP_HOST:?set APP_HOST in .env}
      - --fingerprint
      - --no-stun
      - --use-auth-secret
      - --static-auth-secret=${TURN_AUTH_SECRET:?set TURN_AUTH_SECRET in .env}
      - --user-quota=2
      - --total-quota=4
      - --max-bps=32000
      - --bps-capacity=128000
      - --no-cli
      - --no-tcp-relay
      - --no-tls
      - --no-dtls
      - --no-loopback-peers
      - --no-multicast-peers
      - --no-software-attribute
      - --relay-threads=1
      - --pidfile=/tmp/turnserver.pid
    security_opt: ["no-new-privileges:true"]
    # The image's turnserver executable carries this file capability. Preserve
    # only that capability while dropping Docker's default capability set.
    cap_add: [NET_BIND_SERVICE]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 96m
    mem_reservation: 48m
    cpus: "0.20"
    read_only: true
    tmpfs: [/tmp, /var/lib/coturn]
    logging:
      options:
        max-size: 5m
        max-file: "2"
    networks:
      turn-edge:
        ipv4_address: 172.30.0.2

volumes:
  angara-db:
  caddy-data:
  caddy-config:

networks:
  angara-internal:
    internal: true
  angara-edge:
  turn-edge:
    ipam:
      config:
        - subnet: 172.30.0.0/29
