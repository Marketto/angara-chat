services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_wal_size=256MB
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - angara-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [angara-internal]
    shm_size: 96mb
    pids_limit: 100

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    networks: [angara-internal, angara-edge]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [angara-edge]

volumes:
  angara-db:
  caddy-data:
  caddy-config:

networks:
  angara-internal:
    internal: true
  angara-edge:
