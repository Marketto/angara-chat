name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat -d chat_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://chat:test-only-password@localhost:5432/chat_test?schema=public
      GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
      VAPID_PUBLIC_KEY: test-public-key
      VAPID_PRIVATE_KEY: test-private-key
      VAPID_SUBJECT: mailto:test@example.com
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @angara/api db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
